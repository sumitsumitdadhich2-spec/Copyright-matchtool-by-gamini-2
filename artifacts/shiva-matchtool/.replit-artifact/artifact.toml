kind = "web"
previewPath = "/"
title = "Shiva MatchTool"
description = "An AI-assisted video matching workspace that helps creators find where short clips appear inside full-length movies, review matches, and export reports."
version = "1.0.0"
id = "artifacts/shiva-matchtool"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20806

[services.development]
run = "pnpm --filter @workspace/shiva-matchtool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shiva-matchtool", "run", "build" ]
serve = "static"
publicDir = "artifacts/shiva-matchtool/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20806"
BASE_PATH = "/"
